name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.3"

      # Ruff needs no Home Assistant environment; installing the full HA test
      # requirements here repeatedly broke CI when HA's pinned test deps
      # (e.g. mypy-dev pre-releases) disappeared from the package index.
      - name: Check code format
        run: uvx ruff@0.13.0 format . --check

      - name: Check code with Ruff
        run: uvx ruff@0.13.0 check .
