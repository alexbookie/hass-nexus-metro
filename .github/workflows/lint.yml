name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.3"

      # Ruff needs no Home Assistant environment; installing the full HA test
      # requirements here repeatedly broke CI when HA's pinned test deps
      # (e.g. mypy-dev pre-releases) disappeared from the package index.
      - name: Check code format
        run: uvx ruff@0.13.0 format . --check

      - name: Check code with Ruff
        run: uvx ruff@0.13.0 check .
